# DisasterMind Commander Dashboard (PRD Step 7 + Step 10).
#
# Runs the api package's serving entrypoint (`python -m disastermind.api`). That
# wrapper assembles the FULL transport — create_app() routes plus the static UI,
# the opt-in API-key/rate-limit security middleware, CORS and the background
# loop-driver thread. Launching uvicorn directly against the bare create_app
# factory would silently skip all of those (auth unenforced, dashboard dead at
# messages_seen=0), so don't.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: disastermind-api
  labels:
    app.kubernetes.io/name: disastermind-api
    app.kubernetes.io/part-of: disastermind
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: disastermind-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: disastermind-api
        app.kubernetes.io/part-of: disastermind
    spec:
      containers:
        - name: api
          image: disastermind:latest
          imagePullPolicy: IfNotPresent
          # Serve the dashboard via the package entrypoint (binds $PORT on 0.0.0.0).
          command: ["python"]
          args:
            - "-m"
            - "disastermind.api"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: disastermind-config
          volumeMounts:
            - name: audit-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        # Writable home for the hash-chained audit log (DM_AUDIT_LOG=/data/audit.jsonl
        # in the configmap). emptyDir survives restarts of the container within a
        # pod; use a PVC if the trail must survive pod rescheduling.
        - name: audit-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: disastermind-api
  labels:
    app.kubernetes.io/name: disastermind-api
    app.kubernetes.io/part-of: disastermind
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: disastermind-api
  ports:
    - name: http
      port: 80
      targetPort: http
